<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Power BI Dashboard</title>
  <style>
    :root {
      --navy: #0a1633;
      --navy-edge: #1c2c57;
      --text: #e6ebf7;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--navy);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      gap: 16px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.25rem, 2.5vw, 1.75rem);
      font-weight: 600;
    }
    .frame {
      flex: 1;
      width: 100%;
      max-width: 1280px;
      min-height: 420px;
      border: 1px solid var(--navy-edge);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <h1>Power BI Dashboard</h1>
  <div class="frame">
    <iframe
      title="Power BI Report"
      src="https://app.powerbi.com/view?r=eyJrIjoiZmRhZDRlMzUtZmZjNC00YTBhLTkwMmYtMzc1MDYyZDc4ZDJmIiwidCI6IjVmOTA5NjYwLWUxMDQtNDNkNC1hOGViLTA2YjNjNTkxYjBiMSJ9"
      allowfullscreen="true">
    </iframe>
  </div>
</body>
</html>
